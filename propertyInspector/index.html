<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WLED Control</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#171717;color:#eee;font:13px Arial,sans-serif}
.card{max-width:420px;margin:auto;background:#151515;border-radius:16px;padding:22px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}.logo{width:48px;height:48px;border-radius:12px;background:#292d37;display:grid;place-items:center;font-size:26px}
h2{font-size:17px;margin:0 0 5px}.sub{color:#aaa;font-size:12px}
button{width:100%;border:0;border-radius:9px;padding:14px;background:#303030;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}#status{font-size:12px;color:#aeb4bd;margin-top:12px;min-height:18px}
</style></head><body><div class="card">
<div class="brand"><div class="logo">💡</div><div><h2>WLED Control</h2><div class="sub">AJAZZ Plugin · ESP32 / WLED</div></div></div>
<button id="open" disabled>Открыть настройки</button><div id="status">Ожидание подключения к StreamDock…</div>
</div>
<script>
let $websocket=null,$uuid=null,$action=null,$context=null,$settingsUrl=null;
const $status=document.getElementById('status'),$button=document.getElementById('open');
WebSocket.prototype.openUrl=function(url){
  this.send(JSON.stringify({
    event: "openUrl",
    payload: { url }
  }));
};
function connectElgatoStreamDeckSocket(port,uuid,event,app,info){
  let parsed={};try{parsed=JSON.parse(info||'{}')}catch(_){}
  $uuid=uuid;$action=parsed.action;$context=parsed.context;
  $websocket=new WebSocket('ws://127.0.0.1:'+port);
  $websocket.onopen=()=>{$websocket.send(JSON.stringify({event,uuid}));$button.disabled=false;$status.textContent='Плагин подключён.';};
  $websocket.onmessage=e=>{
    let data;try{data=JSON.parse(e.data)}catch(_){return;}
    if(data.event==='sendToPropertyInspector' && data.context===$context){
      const p=data.payload||{};
      if(p.type==='hello'){
        $settingsUrl=p.settingsUrl||$settingsUrl;
        $status.textContent=$settingsUrl?'Подключено. Панель настроек готова.':'Подключено. Ожидаем запуск панели настроек…';
      }
      if(p.type==='settingsPanel' && p.url){$settingsUrl=p.url;$status.textContent='Панель настроек готова.';}
    }
  };
  $websocket.onerror=()=>{$button.disabled=true;$status.textContent='Ошибка WebSocket StreamDock.';};
  $websocket.onclose=()=>{$button.disabled=true;$status.textContent='Соединение со StreamDock закрыто.';};
}
$button.addEventListener('click',()=>{
  if(!$websocket || $websocket.readyState !== WebSocket.OPEN){
    $status.textContent='Нет соединения со StreamDock.';
    return;
  }
  // Same protocol as the working Yandex Music Ajazz plugin:
  // send openUrl directly from the Property Inspector WebSocket.
  const url=$settingsUrl || 'http://127.0.0.1:17895/';
  try {
    $websocket.openUrl(url);
    $status.textContent='Открываем панель настроек: '+url;
  } catch(e) {
    $status.textContent='Ошибка открытия панели: '+e.message;
  }
});
</script></body></html>
